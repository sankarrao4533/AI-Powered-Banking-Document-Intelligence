[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-banking-intelligence"
version = "2.0.0"
description = "Enterprise Banking Document Intelligence & Regulatory GraphRAG"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Sentinel Engineering Team"}
]
keywords = [
    "banking",
    "compliance",
    "graphrag",
    "neo4j",
    "networkx",
    "fastapi",
    "streamlit",
    "rag"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
